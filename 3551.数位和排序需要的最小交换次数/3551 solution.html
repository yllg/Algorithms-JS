<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 方法一：置换环
        // 时间复杂度：O(nlogn+nlogM)
        // 空间复杂度：O(n)
        var minSwaps = function (nums) {
            const n = nums.length;
            const digitSum = new Array(n);
            for (let i = 0; i < n; i++) {
                let x = nums[i], sum = 0;
                while (x > 0) {
                    sum += x % 10;
                    x = Math.floor(x / 10);
                }
                digitSum[i] = sum;
            }

            const indices = Array.from({ length: n }, (_, i) => i);
            indices.sort((a, b) => {
                if (digitSum[a] !== digitSum[b]) {
                    return digitSum[a] - digitSum[b];
                }
                return nums[a] - nums[b];
            });

            const targetPos = new Array(n);
            for (let pos = 0; pos < n; pos++) {
                targetPos[indices[pos]] = pos;
            }

            const visited = new Array(n).fill(false);
            let cycles = 0;
            for (let i = 0; i < n; i++) {
                if (!visited[i]) {
                    cycles++;
                    let j = i;
                    while (!visited[j]) {
                        visited[j] = true;
                        j = targetPos[j];
                    }
                }
            }

            return n - cycles;
        };

        // 方法二：并查集
        // 时间复杂度：O(nlogn+nlogM)
        // 空间复杂度：O(n)
        var minSwaps = function (nums) {
            const n = nums.length;
            const digitSum = new Array(n);
            for (let i = 0; i < n; i++) {
                let x = nums[i], sum = 0;
                while (x > 0) {
                    sum += x % 10;
                    x = Math.floor(x / 10);
                }
                digitSum[i] = sum;
            }

            const indices = Array.from({ length: n }, (_, i) => i);
            indices.sort((a, b) => {
                if (digitSum[a] !== digitSum[b]) {
                    return digitSum[a] - digitSum[b];
                }
                return nums[a] - nums[b];
            });

            const targetPos = new Array(n);
            for (let pos = 0; pos < n; pos++) {
                targetPos[indices[pos]] = pos;
            }

            const parent = Array.from({ length: n }, (_, i) => i);
            let components = n;

            const find = (x) => {
                if (parent[x] !== x) {
                    parent[x] = find(parent[x]);
                }
                return parent[x];
            };

            for (let i = 0; i < n; i++) {
                const ri = find(i);
                const rj = find(targetPos[i]);
                if (ri !== rj) {
                    parent[ri] = rj;
                    components--;
                }
            }

            return n - components;
        };

        // test
        let nums = [18, 43, 34, 16];
        console.log(minSwaps(nums));
    </script>
