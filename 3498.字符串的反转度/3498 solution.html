<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 方法一：模拟
        // 时间复杂度：O(n)
        // 空间复杂度：O(1)
        var reverseDegree = function (s) {
            let ans = 0;
            for (let i = 1; i <= s.length; i++) {
                ans += (26 - (s.charCodeAt(i - 1) - 97)) * i;
            }
            return ans;
        };

        // test
        let s = "abc"
        console.log(reverseDegree(s));
    </script>
</body>

</html>
