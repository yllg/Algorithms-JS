<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 方法一：检查位置
        // 时间复杂度：O(1)
        // 空间复杂度：O(1)
        var isRectangleOverlap = function (rec1, rec2) {
            if (
                rec1[0] === rec1[2] ||
                rec1[1] === rec1[3] ||
                rec2[0] === rec2[2] ||
                rec2[1] === rec2[3]
            ) {
                return false;
            }

            return !(
                rec1[2] <= rec2[0] || // left
                rec1[3] <= rec2[1] || // bottom
                rec1[0] >= rec2[2] || // right
                rec1[1] >= rec2[3]    // top
            );
        };

        // 方法二：检查区域。检查线段交集
        // 时间复杂度：O(1)
        // 空间复杂度：O(1)
        var isRectangleOverlap = function (rec1, rec2) {
            return (
                Math.min(rec1[2], rec2[2]) > Math.max(rec1[0], rec2[0]) &&
                Math.min(rec1[3], rec2[3]) > Math.max(rec1[1], rec2[1])
            );
        };

        // test
        let rec1 = [0, 0, 2, 2], rec2 = [1, 1, 3, 3]
        console.log(isRectangleOverlap(rec1, rec2))
    </script>
</body>

</html>
