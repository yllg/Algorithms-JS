<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 方法一：排序 + 贪心
        // 时间复杂度：O(nlogn)
        // 空间复杂度：O(logn)
        var minimizeSum = function (nums) {
            const n = nums.length;
            nums.sort((a, b) => a - b);
            return Math.min(nums[n - 1] - nums[2], nums[n - 2] - nums[1], nums[n - 3] - nums[0]);
        };

        // 方法二：一次遍历
        // 时间复杂度：O(n)
        // 空间复杂度：O(1)
        var minimizeSum = function (nums) {
            let mn1 = Infinity, mn2 = Infinity, mn3 = Infinity;
            let mx1 = -Infinity, mx2 = -Infinity, mx3 = -Infinity;

            for (const x of nums) {
                if (x < mn1) {
                    [mn1, mn2, mn3] = [x, mn1, mn2];
                } else if (x < mn2) {
                    [mn2, mn3] = [x, mn2];
                } else if (x < mn3) {
                    mn3 = x;
                }

                if (x > mx1) {
                    [mx1, mx2, mx3] = [x, mx1, mx2];
                } else if (x > mx2) {
                    [mx2, mx3] = [x, mx2];
                } else if (x > mx3) {
                    mx3 = x;
                }
            }

            return Math.min(mx1 - mn3, mx2 - mn2, mx3 - mn1);
        };

        // test
        let nums = [1, 4, 7, 8, 5]
        console.log(minimizeSum(nums));
    </script>
</body>

</html>
