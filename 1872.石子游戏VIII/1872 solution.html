<body>
    <script>
        // 方法一：动态规划
        // 时间复杂度：O(n)
        // 空间复杂度：O(n)
        var stoneGameVIII = function (stones) {
            const n = stones.length;
            const pre = new Array(n);
            pre[0] = stones[0];
            for (let i = 1; i < n; i++) {
                pre[i] = pre[i - 1] + stones[i];
            }

            const f = new Array(n);
            f[n - 1] = pre[n - 1];
            for (let i = n - 2; i >= 1; i--) {
                f[i] = Math.max(f[i + 1], pre[i] - f[i + 1]);
            }
            return f[1];
        };

        // test
        let stones = [-1, 2, -3, 4, -5]
        console.log(stoneGameVIII(stones));
    </script>
</body>
