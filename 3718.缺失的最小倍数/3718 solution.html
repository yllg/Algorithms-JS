<body>
    <script>
        // 方法一：枚举 + 哈希表
        // 时间复杂度：O(n)
        // 空间复杂度：O(n)
        var missingMultiple = function (nums, k) {
            const seen = new Set(nums);
            let ans = k;
            while (seen.has(ans)) {
                ans += k;
            }
            return ans;
        };

        // test
        let nums = [8, 2, 3, 4, 6], k = 2
        console.log(missingMultiple(nums, k));
    </script>
</body>
