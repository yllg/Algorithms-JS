<body>
    <script>
        /**
         * @param {number} m
         * @param {number} n
         * @return {string[]}
        */
        var createGrid = function (m, n) {
            const ans = ['.'.repeat(n)]
            for (let i = 0; i < m - 1; i++) {
                ans.push('#'.repeat(n - 1) + '.')
            }
            return ans
        };

    </script>
</body>
