<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 方法一：排序后遍历
        // 时间复杂度：O(nlogn)
        // 空间复杂度：O(logn)
        var targetIndices = function (nums, target) {
            nums.sort((a, b) => a - b);
            const res = [];
            for (let i = 0; i < nums.length; i++) {
                if (nums[i] === target) {
                    res.push(i);
                }
            }
            return res;
        };

        // 方法二：直接统计数量
        // 时间复杂度：O(n)
        // 空间复杂度：O(1)
        var targetIndices = function (nums, target) {
            let cnt1 = 0;  // 小于 target 的元素数量
            let cnt2 = 0;  // 等于 target 的元素数量

            for (const num of nums) {
                if (num < target) {
                    cnt1++;
                } else if (num === target) {
                    cnt2++;
                }
            }

            const res = [];
            for (let i = cnt1; i < cnt1 + cnt2; i++) {
                res.push(i);
            }
            return res;
        };

        // test
        let nums = [1, 2, 5, 2, 3], target = 2
        console.log(targetIndices(nums, target));
    </script>
</body>

</html>
