<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 只有两种操作：反转、左旋一位

        // 方法一：模拟
        // 时间复杂度：O(n)
        // 空间复杂度：O(1)
        var minOperations = function (nums) {
            const n = nums.length;
            if (n === 1) {
                return 0;
            }

            const start = nums.indexOf(0);

            let asc = true;
            let desc = true;

            for (let i = 1; i < n; i++) {
                const value = nums[(start + i) % n];

                if (value !== i) {
                    asc = false;
                }
                if (value !== n - i) {
                    desc = false;
                }

                if (!asc && !desc) {
                    return -1;
                }
            }

            if (asc) {
                return Math.min(start, n - start + 2);
            }

            return Math.min(n - start, start + 2);
        };

        // test
        let nums = [0, 2, 1]
        console.log(minOperations(nums));
    </script>
</body>

</html>
