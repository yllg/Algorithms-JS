<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

<body>
    <script>
        // 方法一：动态规划
        // 时间复杂度：O(nk)
        // 空间复杂度：O(n)
        var numberOfSets = function (n, k) {
            const MOD = 1000000007;
            const dp = Array(n).fill(1);
            const prefixSums = Array(n + 1).fill(0);
            for (let j = 0; j < n; j++)
                prefixSums[j + 1] = (prefixSums[j] + dp[j]) % MOD;
            for (let i = 1; i <= k; i++) {
                dp[0] = 0;
                for (let j = 1; j < n; j++)
                    dp[j] = (dp[j - 1] + prefixSums[j]) % MOD;
                for (let j = 0; j < n; j++)
                    prefixSums[j + 1] = (prefixSums[j] + dp[j]) % MOD;
            }
            return dp[n - 1];
        };


        // 方法二：组合数学
        // 时间复杂度：O(k+logM)
        // 空间复杂度：O(1)
        var numberOfSets = function (n, k) {
            const MOD = 1000000007n;
            const pow = (a, e) => {
                let result = 1n;
                while (e > 0n) {
                    if (e & 1n) result = result * a % MOD;
                    a = a * a % MOD;
                    e >>= 1n;
                }
                return result;
            };
            let numerator = 1n, denominator = 1n;
            for (let i = 1; i <= 2 * k; i++) {
                numerator = numerator * BigInt(n + k - i) % MOD;
                denominator = denominator * BigInt(i) % MOD;
            }
            return Number(numerator * pow(denominator, MOD - 2n) % MOD);
        };

        // test
        let n = 4, k = 2
        console.log(numberOfSets(n, k))
    </script>
</body>

</html>
