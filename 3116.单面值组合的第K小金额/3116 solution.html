<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 方法一：二分答案 + 容斥原理
        // 时间复杂度：O(n * 2^n)
        // 空间复杂度：O(2^n)
        var findKthSmallest = function (coins, k) {
            coins.sort((a, b) => a - b);
            const newCoins = [];
            for (const x of coins) {
                let flag = true;
                for (const y of newCoins) {
                    if (x % y === 0) {
                        flag = false;
                        break;
                    }
                }
                if (flag) {
                    newCoins.push(x);
                }
            }
            coins = newCoins;

            const n = coins.length;
            const m = 1 << n;
            const lcm = new Array(m).fill(0n);
            let l = BigInt(k);
            let r = BigInt(coins[0]) * BigInt(k) + 1n;

            const gcd = (a, b) => {
                a = a < 0n ? -a : a;
                b = b < 0n ? -b : b;
                while (b !== 0n) {
                    [a, b] = [b, a % b];
                }
                return a;
            };

            const trailingZeros = (x) => {
                let count = 0;
                while ((x & 1) === 0) {
                    count++;
                    x >>= 1;
                }
                return count;
            };

            const popcount = (x) => {
                let count = 0;
                while (x) {
                    count += x & 1;
                    x >>= 1;
                }
                return count;
            };

            lcm[0] = 1n;
            for (let mask = 1; mask < m; mask++) {
                const preMask = mask & (mask - 1);
                const i = trailingZeros(mask);

                const coin = BigInt(coins[i]);
                const tmp = lcm[preMask] / gcd(lcm[preMask], coin);
                if (tmp <= r / coin) {
                    lcm[mask] = tmp * coin;
                } else {
                    lcm[mask] = r + 1n;
                }
            }

            const count = (x) => {
                let res = 0n;
                for (let mask = 1; mask < m; mask++) {
                    if (lcm[mask] > x) continue;

                    if (popcount(mask) & 1) {
                        res += x / lcm[mask];
                    } else {
                        res -= x / lcm[mask];
                    }
                }
                return res;
            };

            while (l < r) {
                const mid = (l + r) / 2n;
                if (count(mid) >= k) {
                    r = mid;
                } else {
                    l = mid + 1n;
                }
            }
            return Number(l);
        };

    </script>
</body>

</html>
